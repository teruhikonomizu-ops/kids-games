<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>ふたりの島</title>
<meta name="theme-color" content="#7ec8e3" />
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --sky: #7ec8e3; --leaf: #8fd6a8; --sand: #f6e3b4; --ink: #1b2a4a;
    --coral: #ff8a65; --coral-dark: #e0663f; --teal: #2bb3a3; --teal-dark: #1c8a7d;
    --card: rgba(255,255,255,.92);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    color: var(--ink); overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  body {
    background: linear-gradient(180deg, var(--sky) 0%, var(--leaf) 45%, var(--sand) 100%);
    min-height: 100vh; min-height: 100dvh;
  }
  button { font-family: inherit; }
  #app { position: fixed; inset: 0; display: flex; justify-content: center; overflow: hidden; }

  /* ===== ウィザード（初回セットアップ） ===== */
  .wizwrap { width: 100%; max-width: 460px; height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .wizcard {
    background: var(--card); border-radius: 26px; padding: 28px 22px; width: 100%;
    box-shadow: 0 14px 40px rgba(20,40,60,.25); text-align: center; position: relative;
  }
  .wiztitle { font-size: clamp(22px, 6vw, 30px); margin: 4px 0 6px; }
  .wizsub { font-size: 15px; line-height: 1.7; opacity: .82; margin: 0 0 18px; }
  .wizbody { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
  .backbtn { position: absolute; top: 16px; left: 16px; border: none; background: none; color: var(--ink); opacity: .55; font-size: 14px; font-weight: 700; cursor: pointer; padding: 6px; }
  .wizerror { color: #c0392b; font-weight: 700; font-size: 14px; margin: -4px 0 4px; }

  .bigcard {
    appearance: none; border: 3px solid var(--teal); border-radius: 20px; background: #fff; cursor: pointer;
    padding: 20px 14px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    box-shadow: 0 6px 0 #bcd; transition: transform .05s;
  }
  .bigcard:active { transform: translateY(4px); box-shadow: 0 2px 0 #bcd; }
  .bigcard-emoji { font-size: 46px; line-height: 1; }
  .bigcard-label { font-size: 18px; font-weight: 800; line-height: 1.3; }
  .bigcard-sub { font-size: 12px; opacity: .65; margin-top: 2px; }

  .bigtext {
    font-size: 20px; text-align: center; padding: 14px; border-radius: 14px; border: 3px solid var(--teal);
    font-family: inherit; font-weight: 700; color: var(--ink);
  }
  .nextbtn {
    appearance: none; border: none; cursor: pointer; font-weight: 800; color: #fff; font-size: 18px;
    background: linear-gradient(180deg, var(--coral), var(--coral-dark)); border-radius: 16px; padding: 15px;
    min-height: 56px; box-shadow: 0 5px 0 #b1461f; transition: transform .05s;
  }
  .nextbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b1461f; }
  .nextbtn[disabled] { opacity: .4; }
  .nextbtn.secondary { background: linear-gradient(180deg, #fff, #e8f4f2); color: var(--teal-dark); box-shadow: 0 5px 0 #bcd; }

  .avatargrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .avatarbtn {
    font-size: 34px; padding: 16px 0; min-height: 64px; border-radius: 16px; border: 3px solid transparent; background: #eef6f4; cursor: pointer;
  }
  .avatarbtn.selected { border-color: var(--coral); background: #fff0ea; }
  .avatarbtn.disabled { opacity: .25; }

  .confirmrow { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
  .confirmavatar { font-size: 44px; }
  .confirmname { font-size: 22px; font-weight: 800; }
  .invitecode {
    font-size: 30px; font-weight: 900; letter-spacing: 3px; background: #eef6f4; border-radius: 14px;
    padding: 14px; margin: 6px 0 16px; color: var(--teal-dark);
  }

  /* ===== メイン画面 ===== */
  .shell { width: 100%; max-width: 460px; height: 100%; display: flex; flex-direction: column; }
  .header {
    padding: calc(env(safe-area-inset-top,0px) + 10px) 16px 8px; text-align: center;
  }
  .headertitle { font-size: 18px; font-weight: 800; text-shadow: 0 2px 0 rgba(255,255,255,.5); }
  .headersub { display: block; font-size: 12px; font-weight: 700; opacity: .6; margin-top: 2px; }

  .footbanner {
    margin: 0 12px 8px; background: #fff7e0; border: 2px solid #ffd873; border-radius: 16px; padding: 10px 14px;
    display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; box-shadow: 0 4px 10px rgba(0,0,0,.08);
  }
  .footlines { flex: 1; line-height: 1.6; }
  .footok { appearance: none; border: none; background: #ffd873; color: #5a4200; font-weight: 800; border-radius: 14px; padding: 12px 16px; cursor: pointer; font-size: 14px; min-height: 48px; }

  .tabcontent { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 12px 12px; }
  .tabcontent.solo { padding-bottom: calc(env(safe-area-inset-bottom,0px) + 20px); }

  .tabbar {
    display: flex; gap: 8px; padding: 8px 10px calc(env(safe-area-inset-bottom,0px) + 10px);
    background: rgba(255,255,255,.85); backdrop-filter: blur(6px); border-top: 2px solid rgba(0,0,0,.06);
  }
  .tabbtn {
    flex: 1; appearance: none; border: none; background: transparent; border-radius: 16px; padding: 10px 4px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink); opacity: .55;
    min-height: 64px;
  }
  .tabbtn.active { opacity: 1; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.12); }
  .tabicon { font-size: 30px; }
  .tablabel { font-size: 12px; font-weight: 800; max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .loadingwrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; height: 100%; width: 100%; font-size: 22px; font-weight: 800; text-align: center; line-height: 1.6; padding: 0 24px; }
  .loadingwrap .nextbtn { width: 100%; max-width: 220px; }

  /* ===== 区画 ===== */
  .zone { display: flex; flex-direction: column; gap: 14px; }
  .beachbox { background: var(--card); border-radius: 20px; padding: 14px; box-shadow: 0 6px 16px rgba(20,40,60,.1); }
  .beachlabel { font-size: 13px; font-weight: 800; opacity: .7; margin-bottom: 8px; }
  .driftbtn {
    width: 100%; appearance: none; border: 3px dashed var(--coral); background: #fff3ec; border-radius: 16px; cursor: pointer;
    padding: 14px; display: flex; align-items: center; gap: 10px;
  }
  .driftemoji { font-size: 34px; animation: bob 1.6s ease-in-out infinite; }
  .driftname { flex: 1; text-align: left; font-weight: 800; font-size: 15px; }
  .driftnew { font-weight: 900; color: var(--coral-dark); font-size: 13px; }
  .driftdone { font-size: 14px; font-weight: 700; opacity: .75; padding: 6px 2px; }
  .treasurerow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .treasureitem { display: flex; flex-direction: column; align-items: center; gap: 4px; background: #eef6f4; border-radius: 14px; padding: 8px 10px; font-size: 26px; }
  .giftbtn { appearance: none; border: none; background: var(--teal); color: #fff; font-size: 12px; font-weight: 800; border-radius: 10px; padding: 8px 10px; cursor: pointer; min-height: 36px; }

  .plotgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .plot {
    appearance: none; border: 3px solid #c9e8d8; background: #eef9f1; border-radius: 18px; cursor: pointer;
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.05);
  }
  .plot.empty { border-style: dashed; }
  .plotplus { font-size: 26px; color: var(--teal); font-weight: 900; }
  .plotplus.faint { opacity: .3; font-size: 22px; }
  .plotemoji { font-size: 34px; display: block; transition: transform .2s; }
  .plotemoji.bloomanim { animation: bloom 1.4s ease-in-out infinite; }
  .plotsub { font-size: 11px; font-weight: 800; opacity: .7; }
  .plot.bloom { border-color: var(--coral); background: #fff3ec; }

  .kitbox { background: var(--card); border-radius: 20px; padding: 14px; box-shadow: 0 6px 16px rgba(20,40,60,.1); }
  .kitpickbtn {
    width: 100%; appearance: none; border: none; background: linear-gradient(180deg, var(--teal), var(--teal-dark)); color: #fff;
    font-weight: 800; font-size: 15px; border-radius: 14px; padding: 13px; min-height: 52px; cursor: pointer; box-shadow: 0 4px 0 #146058;
  }
  .kitpickbtn.small { margin-top: 10px; font-size: 13px; padding: 10px; min-height: 44px; }
  .kitempty { font-size: 13px; opacity: .6; text-align: center; padding: 8px; }
  .kitcard2 { display: flex; align-items: center; gap: 12px; }
  .kitemoji { font-size: 40px; transition: all .3s; }
  .kitemoji.big { font-size: 60px; }
  .kitname { font-weight: 800; font-size: 15px; }
  .kitdots { display: flex; gap: 4px; margin-top: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #d8e8e2; }
  .dot.filled { background: var(--coral); }

  /* ===== じゆうにつくる ===== */
  .buildbox { background: var(--card); border-radius: 20px; padding: 14px; box-shadow: 0 6px 16px rgba(20,40,60,.1); }
  .buildlabel { font-size: 13px; font-weight: 800; opacity: .7; margin-bottom: 10px; }
  .palette { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .paletteitem {
    width: 52px; height: 52px; font-size: 26px; appearance: none; border: 3px solid #e2ede8; background: #f8fbfa;
    border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .paletteitem.selected { border-color: var(--coral); background: #fff3ec; transform: scale(1.06); }
  .paletteitem.eraser { background: #f3f0ec; }
  .buildgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .buildcell {
    appearance: none; border: 2px dashed #d8e2df; background: #f6f9f8; border-radius: 12px; cursor: pointer;
    aspect-ratio: 1; font-size: 26px; display: flex; align-items: center; justify-content: center;
  }
  .buildcell.filled { border-style: solid; border-color: #cfe4dd; background: #eef9f1; }

  /* ===== 広場 ===== */
  .plaza { display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
  .plazahead { background: var(--card); border-radius: 20px; padding: 20px; width: 100%; box-shadow: 0 6px 16px rgba(20,40,60,.1); }
  .plazaseriescount { font-size: 12px; font-weight: 800; opacity: .55; margin-top: 4px; }
  .plazaparts { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .plazapart {
    width: 66px; height: 66px; border-radius: 50%; font-size: 28px; border: 3px solid #d8e8e2; background: #eef9f1;
    display: flex; align-items: center; justify-content: center; cursor: default;
  }
  .plazapart.unlocked { border-color: #ffd873; background: #fff7e0; cursor: pointer; animation: pulse 1.6s ease-in-out infinite; }
  .plazapart.placed { border-color: var(--teal); background: #eef6f4; animation: none; }
  .plazapart.locked { opacity: .5; }
  .plazanudge { background: #fff7e0; border: 2px solid #ffd873; border-radius: 14px; padding: 10px 14px; font-size: 13px; font-weight: 800; }
  .logbookbtn {
    appearance: none; border: none; background: var(--card); color: var(--ink); font-weight: 800; font-size: 14px;
    border-radius: 16px; padding: 14px; cursor: pointer; box-shadow: 0 6px 16px rgba(20,40,60,.1); width: 100%;
  }
  .logbookbtn.small { margin-top: 10px; padding: 11px; font-size: 13px; box-shadow: none; background: #eef6f4; }

  /* ===== モーダル ===== */
  #modalRoot:empty { display: none; }
  .modalbg {
    position: fixed; inset: 0; background: rgba(10,20,30,.55); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modalcard {
    background: #fff; border-radius: 22px; padding: 20px; max-width: 420px; width: 100%; max-height: 82vh; overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
  }
  .modaltitle { font-size: 19px; font-weight: 800; text-align: center; margin: 2px 0 14px; }
  .logbookgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  .logcell { aspect-ratio: 1; border-radius: 14px; background: #eef2f6; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #b8c2cf; }
  .logcell.found { background: #eef9f1; }
  .logcell.found.rare { background: linear-gradient(135deg, #fff3ec, #ffe8c2); }
  .seedgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .seedbtn {
    appearance: none; border: 2px solid #e2ede8; background: #f8fbfa; border-radius: 16px; padding: 14px 4px; cursor: pointer;
    min-height: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  }
  .seedemoji { font-size: 30px; }
  .seedname { font-size: 11px; font-weight: 800; }
  .seeddays { font-size: 10px; opacity: .55; }

  /* ===== トースト ===== */
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom,0px) + 92px); transform: translate(-50%, 12px);
    background: var(--ink); color: #fff; font-weight: 800; font-size: 14px; padding: 10px 18px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 60; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes bloom { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,216,115,.6); } 50% { box-shadow: 0 0 0 8px rgba(255,216,115,0); } }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="modalRoot"></div>
  <div id="toast"></div>

  <!-- Firebase（2人で共有する時に使う。今は1人で遊ぶ段階なので外部読み込みをしない。
       共有を始める時：この2行を戻し、sync.jsのFIREBASE_CONFIGを設定する。
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  -->

  <script src="data.js"></script>
  <script src="sync.js"></script>
  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
